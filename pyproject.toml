[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detect-objects"
version = "0.1.0"
description = "Real-time object detection with OpenCV and YOLO-World"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "cv2-enumerate-cameras>=1.3.3",
    "ipykernel>=7.3.0",
    "mlx-audio==0.4.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai-whisper==20250625",
    "opencv-python==5.0.0.93",
    "pandas>=3.0.5",
    "pyobjc-framework-avfoundation; sys_platform == 'darwin'",
    "pyobjc-framework-soundanalysis; sys_platform == 'darwin'",
    "pyttsx3==2.99",
    "rich>=15.0.0",
    "sounddevice==0.5.5",
    "soundfile==0.13.1",
    "textual>=8.2.8",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics==8.4.107",
]

[project.scripts]
odia = "detect_objects.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"detect_objects.voice_text_convert" = ["*.json"]

[dependency-groups]
dev = [
    "black==26.5.1",
    "jupyterlab>=4.4",
    "nbclient>=0.10",
    "nbformat>=5.10",
]
